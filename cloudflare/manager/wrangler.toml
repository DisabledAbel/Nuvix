name = "nuvix-manager"
main = "src/worker.js"
compatibility_date = "2026-10-26"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ManagerRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ManagerRoom"]

[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "61001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "61002"
simple = { limit = 120, period = 60 }

[observability]
enabled = false

# Preview bindings are not inherited from production. Cloudflare creates an
# isolated namespace for this same-Worker Durable Object in each Preview.
[[previews.durable_objects.bindings]]
name = "ROOMS"
class_name = "ManagerRoom"

[[previews.ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "62001"
simple = { limit = 10, period = 60 }

[[previews.ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "62002"
simple = { limit = 120, period = 60 }

[previews.observability]
enabled = false
