name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your provider's URL, username or password here.** Issues are public and
        permanent. Redact them.
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: The single most useful field in this form. Most bugs here are device-specific.
      placeholder: "Ugoos AM9 Pro, Android 14 / Fire TV Stick 4K, Fire OS 7"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenTV version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: source_kind
    attributes:
      label: Source type
      options:
        - Xtream Codes login
        - M3U playlist
        - Both
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Live TV
        2. Press channel-up five times quickly
        3. Playback stops and does not recover
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "adb logcat -s OpenTV:* EpgRepository:* SyncWorker:* — check for credentials before pasting"
      render: shell
