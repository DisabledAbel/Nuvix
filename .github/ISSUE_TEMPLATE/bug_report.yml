name: Bug report
description: Report a reproducible Nuvix problem. Keep all provider information private.
title: '[Bug]: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'Issues are public. Never share IPTV credentials, private portal/playlist/stream URLs, MAC
      addresses, serial numbers, Device ID 1/2, signatures, other device identity fields, tokens, cloud
      keys or personal information. Review and sanitize screenshots and logs before attaching; use [REDACTED]
      or synthetic examples. Nuvix supplies no channels, subscriptions or media. Use only provider-authorized
      accounts and identities.


      Search existing issues first. Use one report per bug. For session summaries use the Beta test report
      form. For suspected vulnerabilities, see [private reporting guidance](https://github.com/DisabledAbel/Nuvix/blob/main/docs/BETA-FEEDBACK.md#security-and-sensitive-reports).'
- type: input
  id: summary
  attributes:
    label: Short description
    placeholder: A brief, specific summary of the problem
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Nuvix version and build number
    description: Use Settings → About → Nuvix version when installed, or verified release/download details when available. Include the exact candidate if known. If installation failed and the build is unknown, enter “not installed”; do not guess.
    placeholder: Version name and build number as displayed
  validations:
    required: true
- type: input
  id: manufacturer
  attributes:
    label: TV / device manufacturer
    placeholder: Manufacturer only; no serial number or device identifier
  validations:
    required: true
- type: input
  id: model
  attributes:
    label: TV / device model
    placeholder: Exact public model name; no MAC or serial number
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: Operating system and version
    placeholder: Android TV / Google TV Android version, or Fire OS version
  validations:
    required: true
- type: dropdown
  id: feature
  attributes:
    label: Relevant feature
    options:
    - Installation / update
    - Stalker configuration / authentication
    - Live playback
    - EPG / Compact Guide
    - Multi-View
    - DVR / recording
    - Sports Hub
    - Remote navigation / accessibility
    - Cloud sync
    - Other
  validations:
    required: true
- type: dropdown
  id: provider_type
  attributes:
    label: Provider type
    description: Type only; never include a portal URL, provider login or device identity.
    options:
    - M3U / M3U8
    - Xtream Codes
    - Authorized Stalker portal
    - Multiple types (describe without private details)
    - Not Tested
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Include numbered remote actions and safe/synthetic setup details.
    placeholder: '1. Open …

      2. Press …

      3. Observe …'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: Include the sanitized error text, if any.
  validations:
    required: true
- type: dropdown
  id: frequency
  attributes:
    label: Frequency
    options:
    - Every time
    - Often
    - Sometimes
    - Once
    - Unknown
  validations:
    required: true
- type: textarea
  id: screenshots
  attributes:
    label: Screenshots (optional)
    description: Crop or redact credentials, private URLs, MACs, device identities, tokens and personal
      information before attaching.
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: Sanitized logs (optional)
    description: No raw logs, databases or provider exports. Check every line and replace sensitive values
      before pasting. Logs are not required.
    render: text
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy and authorization
    options:
    - label: I have removed credentials, private URLs, MAC addresses, device identity fields, tokens and
        personal information from this report and attachments.
      required: true
    - label: Any provider/account/device identity used in this test is authorized by that provider.
      required: true
