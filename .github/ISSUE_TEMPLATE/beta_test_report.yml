name: Beta test report
description: Summarize one release candidate on one device; mark skipped features Not Tested.
title: '[Beta]: '
labels:
- beta
body:
- type: markdown
  attributes:
    value: 'Issues are public. Never share IPTV credentials, private portal/playlist/stream URLs, MAC
      addresses, serial numbers, Device ID 1/2, signatures, other device identity fields, tokens, cloud
      keys or personal information. Review and sanitize screenshots and logs before attaching; use [REDACTED]
      or synthetic examples. Nuvix supplies no channels, subscriptions or media. Use only provider-authorized
      accounts and identities.


      Beta preparation is in progress; no APK availability is implied by this form. Follow the [beta guide
      and checklists](https://github.com/DisabledAbel/Nuvix/blob/main/docs/BETA-TESTING.md). Report each
      reproducible failure separately with the Bug report form and link it below. JVM/emulator results
      do not establish physical-device acceptance.'
- type: input
  id: candidate
  attributes:
    label: Tested release candidate and build number
    description: Use Settings → About when installed, or verified release/download details when available. If installation failed and the build is unknown, enter “not installed”; do not guess.
    placeholder: Exact RC tag and build number
  validations:
    required: true
- type: input
  id: device
  attributes:
    label: Device manufacturer and model
    description: Public model only; no MAC, serial or device identity.
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: Operating system and version
    description: Android TV, Google TV or Fire OS and its version.
  validations:
    required: true
- type: dropdown
  id: environment
  attributes:
    label: Test environment
    options:
    - Physical TV / streaming device
    - Emulator (not hardware acceptance)
    - Host / JVM only (not hardware acceptance)
  validations:
    required: true
- type: dropdown
  id: installation
  attributes:
    label: Installation result
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: dropdown
  id: provider_type
  attributes:
    label: Provider type tested
    description: Type only. Choose Not Tested if no authorized provider was tested.
    options:
    - M3U / M3U8
    - Xtream Codes
    - Authorized Stalker portal
    - Multiple types (describe without private details)
    - Not Tested
  validations:
    required: true
- type: dropdown
  id: live_playback
  attributes:
    label: Live playback result
    description: Choose Not Tested when skipped; Not Supported requires a device/provider limitation in
      observations.
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: dropdown
  id: epg
  attributes:
    label: EPG result
    description: Choose Not Tested when skipped; Not Supported requires a device/provider limitation in
      observations.
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: dropdown
  id: stalker
  attributes:
    label: Stalker configuration result
    description: Choose Not Tested when skipped; Not Supported requires a device/provider limitation in
      observations.
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: dropdown
  id: multiview
  attributes:
    label: Multi-View result
    description: Choose Not Tested when skipped; Not Supported requires a device/provider limitation in
      observations.
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: dropdown
  id: dvr
  attributes:
    label: DVR result
    description: Choose Not Tested when skipped; Not Supported requires a device/provider limitation in
      observations.
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: dropdown
  id: remote
  attributes:
    label: Remote navigation result
    description: Choose Not Tested when skipped; Not Supported requires a device/provider limitation in
      observations.
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: dropdown
  id: cloud
  attributes:
    label: Cloud sync result
    description: Choose Not Tested when skipped; Not Supported requires a device/provider limitation in
      observations.
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: dropdown
  id: update
  attributes:
    label: App update result
    description: Choose Not Tested when skipped; Not Supported requires a device/provider limitation in
      observations.
    options:
    - Pass
    - Fail
    - Partial
    - Not Tested
    - Not Supported
  validations:
    required: true
- type: textarea
  id: observations
  attributes:
    label: Additional observations and checklist results
    description: List tested checklist rows with Pass/Fail/Partial/Not Tested/Not Supported, panel counts,
      codec/resolution, provider connection allowance if known, storage type and sanitized steps. Explain
      skipped/unsupported checks. Link separate bug reports. Do not include provider identity or URLs.
  validations:
    required: true
- type: textarea
  id: attachments
  attributes:
    label: Sanitized screenshots or logs (optional)
    description: Review and redact all attachments; no provider exports, private identifiers, credentials
      or personal information.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy and authorization
    options:
    - label: I have removed credentials, private URLs, MAC addresses, device identity fields, tokens and
        personal information from this report and attachments.
      required: true
    - label: Any provider/account/device identity used in this test is authorized by that provider.
      required: true
