name: Feature request
description: Suggest an improvement. New features may be deferred until after v1.0.
title: '[Feature]: '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: 'Nuvix is preparing for its first stable v1.0 release. New feature requests may be deferred
      until after v1.0 so testing and release blockers can take priority. Read the [architecture and scope](https://github.com/DisabledAbel/Nuvix/blob/main/docs/ARCHITECTURE.md)
      and search existing requests first.


      Issues are public. Never share IPTV credentials, private portal/playlist/stream URLs, MAC addresses,
      serial numbers, Device ID 1/2, signatures, other device identity fields, tokens, cloud keys or personal
      information. Review and sanitize screenshots and logs before attaching; use [REDACTED] or synthetic
      examples. Nuvix supplies no channels, subscriptions or media. Use only provider-authorized accounts
      and identities.'
- type: textarea
  id: problem
  attributes:
    label: What problem would this solve?
    description: Describe your use case without private provider information.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed improvement
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives or current workaround (optional)
  validations:
    required: false
- type: checkboxes
  id: scope
  attributes:
    label: Release scope
    options:
    - label: I understand this request may be deferred until after v1.0.
      required: true
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy and authorization
    options:
    - label: I have removed credentials, private URLs, MAC addresses, device identity fields, tokens and
        personal information from this report and attachments.
      required: true
    - label: Any provider/account/device identity used in this test is authorized by that provider.
      required: true
