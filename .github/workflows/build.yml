name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install branding validation dependency
        run: python3 -m pip install -r scripts/requirements-branding.txt
      - name: Verify release metadata and branding assets
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify permanent production identity and release gate
        run: python3 scripts/release-identity.py
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Validate Gradle configuration
        run: ./gradlew help --stacktrace
      - name: Compile, run unit and diagnostics UI tests, lint and assemble debug
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Inspect unsigned release package and published version history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-identity.py --metadata app/build/outputs/apk/release/output-metadata.json --android-sdk "$ANDROID_HOME" --history
      - name: Verify bounded Sports Hub queries with synthetic catalogs
        run: python3 scripts/benchmark_sports_queries.py
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  supabase-security:
    name: Supabase migrations and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate migrations, RLS and concurrent merges in isolated PostgreSQL
        run: bash scripts/test-supabase.sh
