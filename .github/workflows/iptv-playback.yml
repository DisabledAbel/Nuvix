name: IPTV Playback Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      public_streams:
        description: Check allowlisted Apple and Mux transport availability (optional)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Offline provider and probe regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install synthetic media generator and existing Python test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install -r scripts/requirements-branding.txt -r scripts/requirements-signing.txt
      - name: Run Python and release identity checks
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release-identity.py
      - name: Run local transport fixtures without external media
        run: python3 scripts/test-iptv-playback.py --mode fixture --output work/iptv-fixture.json --timeout 5
      - name: Summarize
        if: always()
        run: cat work/iptv-fixture.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iptv-fixture-reports
          path: |
            work/iptv-fixture.json
            work/iptv-fixture.md
          if-no-files-found: error

  media3:
    name: Media3 rendered channel-switch and recovery regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install synthetic media generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Restore previous successful comparable playback report
        uses: actions/cache/restore@v5
        with:
          path: work/iptv-baseline.json
          key: iptv-media3-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            iptv-media3-v1-${{ runner.os }}-${{ github.ref_name }}-
            iptv-media3-v1-${{ runner.os }}-main-
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Decode synthetic HLS and TS, recover stalls and exhaust offline retries
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-iptv-android.sh
      - name: Save successful baseline
        if: success()
        run: cp work/iptv-android.json work/iptv-baseline.json
      - uses: actions/cache/save@v5
        if: success()
        with:
          path: work/iptv-baseline.json
          key: iptv-media3-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Summarize real playback measurements
        if: always()
        run: |
          if [ -f work/iptv-android.md ]; then
            cat work/iptv-android.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Media3 tests did not complete; inspect emulator/build job failure.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iptv-media3-reports
          path: |
            work/iptv-android.json
            work/iptv-android.md
            work/iptv-device/iptv-reports/*.json
          if-no-files-found: warn

  public-smoke:
    name: Optional public transport availability
    if: github.event_name == 'workflow_dispatch' && inputs.public_streams
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test-iptv-playback.py --mode public --timeout 10 --output work/iptv-public.json
      - run: cat work/iptv-public.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: iptv-public-availability
          path: |
            work/iptv-public.json
            work/iptv-public.md
