name: Nightly prerelease

on:
  schedule:
    # 21:00 PST (UTC-8), fixed year-round; 22:00 PDT during daylight saving time.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-prerelease
  cancel-in-progress: false

jobs:
  build:
    name: Verify signed nightly and generate description
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual runs also build the default branch, matching scheduled runs.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set nightly version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" -lt 100
          build_id="$(TZ=Etc/GMT+8 date +%Y%m%d).$RUN_NUMBER.$RUN_ATTEMPT"
          echo "NIGHTLY_BUILD_ID=$build_id" >> "$GITHUB_ENV"
          echo "NIGHTLY_VERSION_CODE=$((RUN_NUMBER * 100 + RUN_ATTEMPT))" >> "$GITHUB_ENV"
          echo "tag=nightly-$build_id" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in GEMINI_API_KEY KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!variable}" || { echo "Required secret missing: $variable"; exit 1; }
          done
          [[ "$EXPECTED_SIGNING_CERT_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || { echo 'SIGNING_CERT_SHA256 must be the release certificate fingerprint.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuvix-nightly.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nuvix-nightly.jks" >> "$GITHUB_ENV"
      - name: Install branding validation dependency
        run: python3 -m pip install -r scripts/requirements-branding.txt
      - name: Verify release scripts and branding
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Test, lint and build signed nightly APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew :app:testNightlyUnitTest :app:lintNightly :app:assembleNightly
          -PnightlyBuildId="$NIGHTLY_BUILD_ID"
          -PnightlyVersionCode="$NIGHTLY_VERSION_CODE" --stacktrace
      - name: Verify APK and create corresponding source archive
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/create-release.py --channel nightly --tag "$RELEASE_TAG" --metadata app/build/outputs/apk/nightly/output-metadata.json --android-sdk "$ANDROID_HOME" --expected-certificate-sha256 "$EXPECTED_SIGNING_CERT_SHA256" --output dist
          git archive --format=tar.gz --prefix="nuvix-$RELEASE_TAG/" HEAD > "dist/nuvix-$RELEASE_TAG-source.tar.gz"
      - name: Generate release description with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/nightly-notes.py --tag "$RELEASE_TAG" --output dist/release-notes.md
      - name: Upload verified nightly assets
        uses: actions/upload-artifact@v7
        with:
          name: nuvix-nightly
          path: dist/
          if-no-files-found: error
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nuvix-nightly.jks"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-nightly.*
          if-no-files-found: ignore

  publish:
    name: Publish nightly prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuvix-nightly
          path: dist
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.commit }}
          name: Nuvix ${{ needs.build.outputs.tag }}
          prerelease: true
          make_latest: false
          body_path: dist/release-notes.md
          files: |
            dist/*.apk
            dist/update.json
            dist/SHA256SUMS
            dist/*-source.tar.gz
          fail_on_unmatched_files: true
