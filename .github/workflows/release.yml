name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install branding validation dependency
        run: python3 -m pip install -r scripts/requirements-branding.txt
      - name: Verify release metadata and branding assets
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Validate release tag and signing secrets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A stable vX.Y.Z tag is required.'; exit 1; }
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!variable}" || { echo "Required signing secret missing: $variable"; exit 1; }
          done
          [[ "$EXPECTED_SIGNING_CERT_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || { echo 'Repository variable SIGNING_CERT_SHA256 must contain the long-lived signing certificate fingerprint.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuvix-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nuvix-release.jks" >> "$GITHUB_ENV"
      - name: Test, lint and build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Verify APK and create release assets
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/create-release.py --tag "$RELEASE_TAG" --android-sdk "$ANDROID_HOME" --expected-certificate-sha256 "$EXPECTED_SIGNING_CERT_SHA256" --output dist
          git archive --format=tar.gz --prefix="nuvix-$RELEASE_TAG/" HEAD > "dist/nuvix-$RELEASE_TAG-source.tar.gz"
      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: nuvix-release
          path: dist/
          if-no-files-found: error
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nuvix-release.jks"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  publish:
    name: Publish APK and corresponding source
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuvix-release
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.apk
            dist/update.json
            dist/SHA256SUMS
            dist/*-source.tar.gz
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
          generate_release_notes: true
