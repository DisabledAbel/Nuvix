name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Committed versionName (1.0.0-rc.1 or 1.0.0), without v'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [rc, stable]
        default: rc

permissions:
  contents: read
  actions: read

# Serialize all versions: RC and stable use one application ID/versionCode sequence.
concurrency:
  group: nuvix-release-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}

jobs:
  validate:
    name: Test and prepare unsigned release
    if: github.repository == 'DisabledAbel/Nuvix' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      plan_sha256: ${{ steps.prepare.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate manual request, production protection, commit and version history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-control.py preflight --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL"
      - name: Install branding validation dependency
        run: python3 -m pip install -r scripts/requirements-branding.txt
      - name: Python release policy and branding tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Validate Gradle configuration
        run: ./gradlew help --stacktrace
      - name: Test, lint and build unsigned release and debug APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify bounded Sports Hub queries
        run: python3 scripts/benchmark_sports_queries.py
      - name: Bind unsigned artifacts to this commit and run
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-control.py prepare --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL"
      - name: Upload unsigned preparation only
        uses: actions/upload-artifact@v7
        with:
          name: nuvix-release-prepared
          path: prepared/
          if-no-files-found: error
          retention-days: 7
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*
          if-no-files-found: ignore

  security:
    name: Supabase migrations and security
    if: github.repository == 'DisabledAbel/Nuvix' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/test-supabase.sh

  publish:
    name: Approve, sign and publish
    needs: [validate, security]
    if: github.repository == 'DisabledAbel/Nuvix' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_PLAN_SHA256: ${{ needs.validate.outputs.plan_sha256 }}
      EXPECTED_SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: nuvix-release-prepared
          path: prepared
      - name: Revalidate approval protection, commit, history and artifact checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-control.py verify --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --expected-plan-sha256 "$EXPECTED_PLAN_SHA256"
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'build-tools;36.0.0'
      - name: Sign approved APK and verify package, version and certificate
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 scripts/release-control.py sign --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --expected-plan-sha256 "$EXPECTED_PLAN_SHA256"
      - name: Upload all verified assets to a draft, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-control.py publish --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --expected-plan-sha256 "$EXPECTED_PLAN_SHA256"
      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nuvix-release.jks"
      - name: Report failure or cancellation
        if: failure() || cancelled()
        run: echo 'Release did not complete. Inspect existing tags/drafts before redispatching; no overwrite or automatic retry is allowed.' >> "$GITHUB_STEP_SUMMARY"
