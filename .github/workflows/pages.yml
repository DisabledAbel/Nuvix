name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-docs.py'
      - 'scripts/requirements-docs.txt'
      - 'scripts/tests/test_docs_site.py'
      - 'assets/branding/web/icon-192.png'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build-docs.py'
      - 'scripts/requirements-docs.txt'
      - 'scripts/tests/test_docs_site.py'
      - 'assets/branding/web/icon-192.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - name: Build and validate documentation
        run: |
          python -m pip install -r scripts/requirements-docs.txt
          mkdir -p work
          python scripts/build-docs.py
          python -m unittest scripts.tests.test_docs_site -v
          node --check docs/site.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
